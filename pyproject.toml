[project]
name = "aiges"
version = "0.1.0"
description = "Risk Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.2",
    "hermes-plt>=0.2.2",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "river>=0.25.0",
    "scikit-learn>=1.9.0",
    "supabase>=2.31.0",
    "typer>=0.27.0",
    "uvicorn>=0.51.0",
    "xgboost>=3.2.0",
]

[project.scripts]
aiges = "aiges.cli.cli:app"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pyright>=1.1.400",
    "pytest>=8",
    "pytest-asyncio>=0.26",
    "pytest-cov>=6",
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiges"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
